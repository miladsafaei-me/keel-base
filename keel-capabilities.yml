# Keel capability registry — the SINGLE source of truth that renders BOTH the
# BOOTSTRAP fork picker and the SiteProfile admin panel. keel_base.capabilities
# reads this; the core never imports a capability package, it only probes whether
# each is installed by module name.
#
# Fields:
#   id                a stable short key (used in SiteProfile.enabled_capabilities)
#   package           the pip/GitHub package to add to requirements.txt
#   module            the top-level import that proves the package is installed
#   app               the Django app label a fork adds to INSTALLED_APPS
#   requires          capability ids that must also be installed (resolved transitively)
#   contracts         the host-supplied config/data contracts the capability needs
#   context_processors  template context processors the fork appends (order-preserving)
#   settings_stub     the KEEL_* settings block a fork drops in config/settings.py
#   install_needs_deploy  true if enabling it requires a rebuild + deploy (not just a DB flag)
#   summary           one line for the picker/panel

- id: ui
  package: keel-ui
  module: keel_ui
  app: keel_ui
  requires: []
  contracts: [brand_tokens, theme_signal]
  context_processors: []
  settings_stub: |
    # keel-ui (the cp-* component library). The component registry ships inside
    # the package, so no KEEL_UI_COMPONENTS_ROOT is set.
    KEEL_UI = {
        "risk_warning_url": "/risk-warning",
        "enabled_packs": ["core"],
    }
  install_needs_deploy: true
  summary: Component library (cp-* catalog, renderer, tokens, hero, server-render).

- id: seo
  package: keel-seo
  module: keel_seo
  app: keel_seo
  requires: []
  contracts: [critical_paths, landing_seed, sitemap_hooks]
  context_processors: [keel_seo.context_processors.landing]
  settings_stub: |
    # keel-seo (Landing registry + sitemap + noindex-by-default gate). Greenfield
    # by default: the initial migration creates keel_seo_landing. Set
    # "adopt_existing": True only to adopt a host's pre-existing landing table.
    KEEL_SEO = {
        "cache_ttl": 300,
    }
  install_needs_deploy: true
  summary: Landing Registry, sitemap, noindex-by-default gate, critical-CSS engine.

- id: cms
  package: keel-cms
  module: keel_cms
  app: keel_cms
  requires: [seo, ui]
  contracts: [business_doc, markets_catalog, landing_registry]
  context_processors: []
  settings_stub: |
    # keel-cms (blog / news / glossary engine). Greenfield by default: a plain
    # migrate creates the blog_*/news_* tables. Set KEEL_CMS_ADOPT_EXISTING=True
    # only to adopt a host's pre-existing tables. TopicCluster.conversion_landing
    # targets the swappable landing model below (keel-seo provides the default).
    # A cms fork is authored through the admin-os staff panel (see admin_os below);
    # editor_persist_hook is the panel's in-editor "save while editing" path.
    KEEL_CMS_LANDING_MODEL = "keel_seo.Landing"
    KEEL_CMS = {
        "site_name": "",
        "glossary_title_suffix": "",
        "editor_persist_hook": "keel_cms.admin_os.persist.persist_converted_body",
    }
  # A keel-cms fork is authored through the admin-os staff panel by default: the
  # panel renders inside keel-web's admin shell, hides Django's raw /admin/, and
  # remounts it under /staff/django/. So cms also pulls keel-web — its admin_shell +
  # client apps, appended AFTER keel_cms so keel-cms's navbar/sidebar template
  # shadows win resolution — and wires the admin-os login/url/collectstatic surface.
  # keel_base.capabilities.wiring_for reads this block; a non-cms fork never sees it.
  admin_os:
    pulls: [web]
    apps: [keel_web.admin_shell, keel_web.client]
    settings_stub: |
      # Admin-os is the only admin surface: keel_cms.admin_os.site_urls hides /admin/
      # and remounts Django's admin (login + user/group mgmt) under /staff/django/.
      # Send the panel's unauthenticated visitors there, land them on the dashboard.
      LOGIN_URL = "/staff/django/login/"
      LOGIN_REDIRECT_URL = "/staff/cms/"
      # keel-web admin shell: content_editor_group members (or superusers) reach the
      # panel; denied-but-authenticated users bounce to the public home.
      KEEL_WEB = {
          "content_editor_group": "Content Editor",
          "permission_denied_redirect": "keel_cms:home",
      }
    collectstatic_ignore: tailwind
  install_needs_deploy: true
  summary: Blog/news/glossary engine — shared content models + render pipeline.

- id: content_pipeline
  package: keel-content
  module: keel_content
  app: keel_content
  requires: [ui, cms]
  contracts: [business_doc, content_architecture, prompts_dir, external_domains, intent_registry, publisher_adapter]
  context_processors: []
  settings_stub: |
    # keel-content (multi-stage AI content pipeline: intake -> ContentPlan ->
    # intent gate -> generator). The package ships no default adapter and no
    # concrete external-domain policy — a fork must fill both before generation
    # can run. See keel-content/README.md, "Consume it (host wiring)", for the
    # full contract and the reference adapter to copy.
    KEEL_CONTENT = {
        # "adapter": "content_pipeline.keel_adapter",  # dotted MODULE path (not a class) exposing the ContentPublisher callables: the one seam allowed to touch this fork's CMS models
        # "external_domains": [],  # extra fast-lane hosts for the further-reading gate, on top of the package's finance-default set
    }
  install_needs_deploy: true
  summary: Multi-stage AI content pipeline (intake -> ContentPlan -> intent gate -> generator).

- id: web
  package: keel-web
  module: keel_web
  app: keel_web
  requires: []
  contracts: [brand_name, nav_config]
  context_processors: []
  settings_stub: |
    # keel-web (auth + admin shell + client panel + storage foundation).
    KEEL_WEB = {}
  install_needs_deploy: true
  summary: Auth + admin shell + client panel + storage foundation.
